.draw{stroke-dasharray:var(--len);stroke-dashoffset:0;animation:draw 1s .15s cubic-bezier(.65,0,.35,1) backwards}
.draw2{stroke-dasharray:var(--len);stroke-dashoffset:0;animation:draw 1s .45s cubic-bezier(.65,0,.35,1) backwards}
